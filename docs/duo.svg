<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <title>Made for iPhone Duo: the player beside the queue, albums in two panes, and a stand mode, each in its own layout</title>
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d65db1" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#d65db1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d65db1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="4%" cy="100%" r="48%">
      <stop offset="0" stop-color="#9b5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6c4ea"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472d0"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="art3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#5c6bff"/>
    </linearGradient>
    <linearGradient id="art4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7be3b0"/>
      <stop offset="1" stop-color="#1d9b8a"/>
    </linearGradient>
    <!-- Now Playing takes on the artwork's colours. -->
    <linearGradient id="np" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2066"/>
      <stop offset="0.55" stop-color="#26112f"/>
      <stop offset="1" stop-color="#0f0913"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1233"/>
      <stop offset="1" stop-color="#140b19"/>
    </linearGradient>
    <radialGradient id="npglow" cx="28%" cy="18%" r="75%">
      <stop offset="0" stop-color="#f472d0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#f472d0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="170%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <!-- The lily from the app's icon, drawn in a 1046-unit square. -->
    <g id="lily">
      <path fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" d="M 478 845 C 494 786 500 726 498 677 C 520 674 543 669 564 661 C 644 635 716 585 753 518 C 774 479 813 474 844 503 C 826 431 778 380 729 392 C 688 401 629 548 564 661 M 476 655 C 374 627 290 553 265 458 C 255 415 218 401 180 420 C 215 357 273 317 319 341 C 363 364 405 578 476 655 M 474 536 C 449 459 429 340 425 225 M 503 528 C 514 439 536 320 565 213 M 532 540 C 579 469 631 374 690 283"/>
      <path fill="#ffffff" fill-opacity="0.92" d="M 390 225 A 35 35 0 1 0 460 225 A 35 35 0 1 0 390 225 Z M 530 213 A 35 35 0 1 0 600 213 A 35 35 0 1 0 530 213 Z M 655 283 A 35 35 0 1 0 725 283 A 35 35 0 1 0 655 283 Z"/>
    </g>
    <style>
      text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI Variable Display', 'Segoe UI', system-ui, Inter, 'Helvetica Neue', Arial, sans-serif; }
      .pill { fill: #ffffff; fill-opacity: 0.07; stroke: #ffffff; stroke-opacity: 0.14; }
      .pt { font-size: 17px; font-weight: 600; fill: #e8e8ec; }
      .body { fill: #1b1b20; stroke: #ffffff; stroke-opacity: 0.16; stroke-width: 1.5; }
      .bar { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="28" fill="#0c0a10"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="440" rx="28" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="90" y="92" font-size="15" font-weight="700" letter-spacing="3" fill="#f472d0">TWO DISPLAYS, ONE APP</text>
  <text x="86" y="164" font-size="72" font-weight="700" letter-spacing="-1.5" fill="url(#title)">iPhone Duo</text>
  <text x="90" y="210" font-size="26" font-weight="600" fill="#f0f0f3">Open it, fold it or stand it up.</text>
  <text x="90" y="246" font-size="19" fill="#9a9aa3">Every pose gets a layout of its own, built for its two halves.</text>

  <g>
    <rect class="pill" x="90" y="276" width="236" height="40" rx="20"/>
    <text class="pt" x="208" y="302" text-anchor="middle">Player beside the queue</text>
    <rect class="pill" x="338" y="276" width="134" height="40" rx="20"/>
    <text class="pt" x="405" y="302" text-anchor="middle">Stand mode</text>
    <rect class="pill" x="484" y="276" width="148" height="40" rx="20"/>
    <text class="pt" x="558" y="302" text-anchor="middle">Fold to scrub</text>
  </g>

  <text x="90" y="375" font-size="17" fill="#9a9aa3">Folded, it's the Lily you know. The open layouts need iOS 27.1.</text>

  <!-- Behind: open flat, the player on one half and the queue on the other. -->
  <g transform="translate(700 52) rotate(-6 170 120)">
    <rect x="14" y="24" width="312" height="216" rx="26" fill="#000000" opacity="0.6" filter="url(#shadow)"/>
    <rect class="body" width="340" height="240" rx="26"/>
    <rect x="6" y="6" width="328" height="228" rx="21" fill="url(#np)"/>
    <rect x="6" y="6" width="328" height="228" rx="21" fill="url(#npglow)"/>
    <!-- The fold. -->
    <rect x="168" y="6" width="4" height="228" fill="#000000" fill-opacity="0.35"/>
    <rect x="172" y="6" width="1" height="228" fill="#ffffff" fill-opacity="0.08"/>

    <!-- The player. -->
    <rect x="38" y="26" width="96" height="96" rx="10" fill="url(#art)"/>
    <use href="#lily" transform="translate(39 26.3) scale(0.0918)"/>
    <rect class="bar" x="30" y="138" width="92" height="8" rx="4" fill-opacity="0.92"/>
    <rect class="bar" x="30" y="152" width="58" height="6" rx="3" fill-opacity="0.5"/>
    <rect class="bar" x="30" y="170" width="112" height="3" rx="1.5" fill-opacity="0.2"/>
    <rect class="bar" x="30" y="170" width="44" height="3" rx="1.5" fill-opacity="0.9"/>
    <circle cx="74" cy="171.5" r="4.5" fill="#ffffff"/>
    <g fill="#ffffff">
      <rect x="44" y="190" width="2.5" height="16" rx="1"/>
      <path d="M 60 190 L 48 198 L 60 206 Z"/>
      <circle cx="86" cy="198" r="15"/>
      <path d="M 112 190 L 124 198 L 112 206 Z"/>
      <rect x="125.5" y="190" width="2.5" height="16" rx="1"/>
    </g>
    <path d="M 82 191 L 94 198 L 82 205 Z" fill="#2a1233"/>

    <!-- The queue, its pills at the foot under the thumb. -->
    <g>
      <rect x="184" y="22" width="20" height="20" rx="4" fill="url(#art)"/>
      <rect class="bar" x="212" y="25" width="64" height="6" rx="3" fill-opacity="0.9"/>
      <rect class="bar" x="212" y="35" width="40" height="4" rx="2" fill-opacity="0.45"/>
      <rect x="184" y="52" width="20" height="20" rx="4" fill="url(#art2)"/>
      <rect class="bar" x="212" y="55" width="54" height="6" rx="3" fill-opacity="0.75"/>
      <rect class="bar" x="212" y="65" width="34" height="4" rx="2" fill-opacity="0.4"/>
      <rect x="184" y="82" width="20" height="20" rx="4" fill="url(#art3)"/>
      <rect class="bar" x="212" y="85" width="70" height="6" rx="3" fill-opacity="0.75"/>
      <rect class="bar" x="212" y="95" width="44" height="4" rx="2" fill-opacity="0.4"/>
      <rect x="184" y="112" width="20" height="20" rx="4" fill="url(#art4)"/>
      <rect class="bar" x="212" y="115" width="48" height="6" rx="3" fill-opacity="0.75"/>
      <rect class="bar" x="212" y="125" width="30" height="4" rx="2" fill-opacity="0.4"/>
      <rect x="184" y="142" width="20" height="20" rx="4" fill="url(#art2)"/>
      <rect class="bar" x="212" y="145" width="60" height="6" rx="3" fill-opacity="0.75"/>
      <rect class="bar" x="212" y="155" width="38" height="4" rx="2" fill-opacity="0.4"/>
    </g>
    <rect x="212" y="200" width="40" height="18" rx="9" fill="#ffffff"/>
    <rect x="256" y="200" width="32" height="18" rx="9" fill="#ffffff" fill-opacity="0.14"/>

    <!-- iPhone Duo's own column of tabs down the side. -->
    <rect class="bar" x="304" y="18" width="20" height="6" rx="3" fill-opacity="0.8"/>
    <rect x="301" y="112" width="26" height="110" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.24"/>
    <circle cx="314" cy="128" r="4.5" fill="#f472d0"/>
    <circle cx="314" cy="148" r="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="314" cy="168" r="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="314" cy="188" r="4.5" fill="#ffffff" fill-opacity="0.55"/>
    <circle cx="314" cy="208" r="4.5" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- In front: stood half open, the artwork upright and every control on the flat half. -->
  <g transform="translate(1030 186)">
    <ellipse cx="90" cy="212" rx="128" ry="12" fill="#000000" opacity="0.6" filter="url(#shadow)"/>
    <rect class="body" width="180" height="124" rx="16"/>
    <rect x="5" y="5" width="170" height="114" rx="12" fill="url(#np)"/>
    <rect x="5" y="5" width="170" height="114" rx="12" fill="url(#npglow)"/>
    <rect x="44" y="14" width="92" height="92" rx="9" fill="url(#art)"/>
    <use href="#lily" transform="translate(45 14.3) scale(0.088)"/>
    <!-- The hinge. -->
    <rect x="2" y="124" width="176" height="8" rx="4" fill="#2a2a30"/>
    <path class="body" d="M 0 132 L 180 132 L 214 204 Q 216 210 210 210 L -30 210 Q -36 210 -34 204 Z"/>
    <path d="M 6 137 L 174 137 L 204 202 L -24 202 Z" fill="url(#flat)"/>
    <rect class="bar" x="10" y="146" width="96" height="6" rx="3" fill-opacity="0.9"/>
    <path d="M 4 162 L 176 162 L 177 165 L 3 165 Z" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M 4 162 L 74 162 L 74 165 L 3 165 Z" fill="#ffffff" fill-opacity="0.9"/>
    <g fill="#ffffff">
      <path d="M 50 178 L 38 184 L 51 190 Z"/>
      <ellipse cx="90" cy="184" rx="14" ry="10"/>
      <path d="M 130 178 L 142 184 L 129 190 Z"/>
    </g>
    <path d="M 86 179 L 96 184 L 86 189 Z" fill="#2a1233"/>
  </g>
</svg>
