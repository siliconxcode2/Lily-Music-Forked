# A test release for the phone: pushing a tag such as v1.1.0-beta.1 builds that commit's unsigned .ipa
# and publishes it as a GitHub pre-release, for AltStore, SideStore or Feather to sign on install.
# Full releases stay with release.yml, called by CI on main.
name: Pre-release

on:
  push:
    tags: ['v*-beta*', 'v*-rc*']

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The whole history, for the notes' commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without the keys the build still works; Settings then says Last.fm is unavailable.
      - name: Add the Last.fm keys, if set
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [[ -n $LASTFM_API_KEY && -n $LASTFM_API_SECRET ]]; then
            printf 'LASTFM_API_KEY = %s\nLASTFM_API_SECRET = %s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > Config/Secrets.xcconfig
          fi

      - name: Build Lily.ipa
        run: zsh scripts/build-ipa.sh

      # v1.1.0-beta.1 must have been built as 1.1.0, so a tag can't publish the wrong version.
      - name: Check the version
        run: |
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/DerivedData/Build/Products/Release-iphoneos/Lily.app/Info.plist)
          tagged=${GITHUB_REF_NAME#v}
          if [[ ${tagged%%-*} != "$built" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME is for ${tagged%%-*}, but the app was built as $built."
            exit 1
          fi

      - name: Write the notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "A test build of Lily $GITHUB_REF_NAME. Unsigned: install it with AltStore, SideStore or Feather."
            echo
            echo "## Changes"
            git log --reverse --no-merges --format='- %s' "$previous..$GITHUB_SHA"
          } > build/notes.md

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Lily.ipa --repo "$REPO" --verify-tag --prerelease \
            --title "Lily ${GITHUB_REF_NAME#v}" --notes-file build/notes.md
