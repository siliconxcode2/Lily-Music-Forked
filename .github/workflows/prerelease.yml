# A test release for the phone: a tag such as v1.1.0-beta.1, pushed or given when run by hand, builds that
# commit's unsigned .ipa and publishes it as a GitHub pre-release, for AltStore, SideStore or Feather to sign
# on install. Run by hand, the release makes the tag itself. Full releases stay with release.yml, called by CI
# on main.
name: Pre-release

on:
  push:
    tags: ['v*-beta*', 'v*-rc*']
  workflow_dispatch:
    inputs:
      tag:
        description: The pre-release's tag, such as v1.1.0-beta.1
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(beta|rc)\.[0-9]+$ ]]; then
            echo "::error::$TAG isn't a pre-release tag such as v1.1.0-beta.1."
            exit 1
          fi

      # The whole history, for the notes' commits since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without the keys the build still works; Settings then says Last.fm is unavailable.
      - name: Add the Last.fm keys, if set
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          if [[ -n $LASTFM_API_KEY && -n $LASTFM_API_SECRET ]]; then
            printf 'LASTFM_API_KEY = %s\nLASTFM_API_SECRET = %s\n' "$LASTFM_API_KEY" "$LASTFM_API_SECRET" > Config/Secrets.xcconfig
          fi

      - name: Build Lily.ipa
        run: zsh scripts/build-ipa.sh

      # v1.1.0-beta.1 must have been built as 1.1.0, so a tag can't publish the wrong version.
      - name: Check the version
        run: |
          built=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/DerivedData/Build/Products/Release-iphoneos/Lily.app/Info.plist)
          tagged=${TAG#v}
          if [[ ${tagged%%-*} != "$built" ]]; then
            echo "::error::The tag $TAG is for ${tagged%%-*}, but the app was built as $built."
            exit 1
          fi

      - name: Write the notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          {
            echo "A test build of Lily $TAG. Unsigned: install it with AltStore, SideStore or Feather."
            echo
            echo "## Changes"
            git log --reverse --no-merges --format='- %s' "$previous..$GITHUB_SHA"
          } > build/notes.md

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # A pushed tag is checked to exist; run by hand, the release tags this commit.
          verify=$([[ $GITHUB_EVENT_NAME == push ]] && echo --verify-tag || echo --target=$GITHUB_SHA)
          gh release create "$TAG" build/Lily.ipa --repo "$REPO" $verify --prerelease \
            --title "Lily ${TAG#v}" --notes-file build/notes.md
